name: BL-001 Stage 4 Filter Query Module Boundary

on:
  pull_request:
    branches: [main]
    paths:
      - "BertScript/Test_result_Vis.py"
      - "BertScript/visualization_filter.py"
      - "tests/test_bl001_stage4_filter_query_boundary.py"
      - ".github/workflows/bl001-stage4-filter-query-boundary.yml"
  push:
    branches: [main]
    paths:
      - "BertScript/Test_result_Vis.py"
      - "BertScript/visualization_filter.py"
      - "tests/test_bl001_stage4_filter_query_boundary.py"
      - ".github/workflows/bl001-stage4-filter-query-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filter-query-boundary:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Stage 4 filter semantics without Dash or pandas import
        run: python -m unittest -v tests.test_bl001_stage4_filter_query_boundary tests.test_visualization_stage
