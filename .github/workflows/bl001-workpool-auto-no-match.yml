name: BL-001 External WorkPool Auto No Match Abort

on:
  pull_request:
    branches: [main]
    paths:
      - "text_category_profiler/pipeline/workpool.py"
      - "tests/test_workpool_manager.py"
      - "tests/test_bl001_workpool_auto_no_match.py"
      - ".github/workflows/bl001-workpool-auto-no-match.yml"
  push:
    branches: [main]
    paths:
      - "text_category_profiler/pipeline/workpool.py"
      - "tests/test_workpool_manager.py"
      - "tests/test_bl001_workpool_auto_no_match.py"
      - ".github/workflows/bl001-workpool-auto-no-match.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-unclaimed-job:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fail before data conversion on unmatched external queue
        run: python -m unittest -v tests.test_bl001_workpool_auto_no_match tests.test_bl001_explicit_workid_unclaimed tests.test_workpool_manager tests.test_tcf_workpool_characterization
