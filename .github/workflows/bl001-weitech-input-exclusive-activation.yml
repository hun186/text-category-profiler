name: BL-001 WeiTech Input Exclusive Activation

on:
  pull_request:
    branches: [main]
    paths:
      - "text_category_profiler/pipeline/configuration.py"
      - "tests/test_bl001_weitech_input_exclusive_activation.py"
      - ".github/workflows/bl001-weitech-input-exclusive-activation.yml"
  push:
    branches: [main]
    paths:
      - "text_category_profiler/pipeline/configuration.py"
      - "tests/test_bl001_weitech_input_exclusive_activation.py"
      - ".github/workflows/bl001-weitech-input-exclusive-activation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weitech-input-exclusive-activation:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify external input acquisition preserves Ctrl-C leftovers
        run: python -m unittest -v tests.test_bl001_weitech_input_exclusive_activation tests.test_pipeline_configuration
