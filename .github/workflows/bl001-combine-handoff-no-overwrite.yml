name: BL-001 Stage 3 No Overwrite Handoff

on:
  pull_request:
    branches: [main]
    paths:
      - "BertScript/CombineTestResult.py"
      - "tests/test_bl001_combine_handoff_no_overwrite.py"
      - ".github/workflows/bl001-combine-handoff-no-overwrite.yml"
  push:
    branches: [main]
    paths:
      - "BertScript/CombineTestResult.py"
      - "tests/test_bl001_combine_handoff_no_overwrite.py"
      - ".github/workflows/bl001-combine-handoff-no-overwrite.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combine-no-overwrite:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Stage 3 handoff no-overwrite fixtures and existing adapters
        run: python -m unittest -v tests.test_bl001_combine_handoff_no_overwrite tests.test_result_combination_stage
