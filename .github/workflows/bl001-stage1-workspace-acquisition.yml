name: BL-001 Stage 1 Exclusive Directory Acquisition

on:
  pull_request:
    branches: [main]
    paths:
      - "DatasetConverter/stage.py"
      - "DatasetConverter/core/stage_utils.py"
      - "tests/test_bl001_stage1_workspace_acquisition.py"
      - ".github/workflows/bl001-stage1-workspace-acquisition.yml"
  push:
    branches: [main]
    paths:
      - "DatasetConverter/stage.py"
      - "DatasetConverter/core/stage_utils.py"
      - "tests/test_bl001_stage1_workspace_acquisition.py"
      - ".github/workflows/bl001-stage1-workspace-acquisition.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage1-exclusive-workspace:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify private Stage 1 acquisition and existing unit contracts
        run: python -m unittest -v tests.test_bl001_stage1_workspace_acquisition tests.test_dataset_stage_utils tests.test_data_converter_stage_plan tests.test_data_converter_entrypoint
