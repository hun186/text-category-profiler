name: ClassTable CSV Metadata Contract
on:
  pull_request:
    branches: [main]
    paths:
      - "ClassesTree/data/ClassTable.csv"
      - "BertScript/class_table_metadata.py"
      - "BertScript/class_table_ai_proposals.py"
      - "DatasetConverter/SMS/SMSMerger.py"
      - "text_category_profiler/pipeline/DataConverter_utils.py"
      - "tests/test_sms_merger_path_contract.py"
      - "tests/test_class_table_csv_only.py"
      - "BertScript/migrate_class_table.py"
      - "BertScript/Test_result_Vis.py"
      - "BertScript/Test_result_Vis_layout.py"
      - "BertScript/VisParameters_Format.py"
      - "ClassesTree/data/TopicTree.csv"
      - "tests/test_class_table_metadata.py"
      - "tests/test_class_table_ai_proposals.py"
      - "docs/class-table-metadata.md"
      - ".github/workflows/class-table-metadata.yml"
  push:
    branches: [main]
    paths:
      - "ClassesTree/data/ClassTable.csv"
      - "BertScript/class_table_metadata.py"
      - "BertScript/class_table_ai_proposals.py"
      - "DatasetConverter/SMS/SMSMerger.py"
      - "text_category_profiler/pipeline/DataConverter_utils.py"
      - "tests/test_sms_merger_path_contract.py"
      - "tests/test_class_table_csv_only.py"
      - "BertScript/migrate_class_table.py"
      - "BertScript/Test_result_Vis.py"
      - "ClassesTree/data/TopicTree.csv"
      - "tests/test_class_table_metadata.py"
      - "tests/test_class_table_ai_proposals.py"
      - ".github/workflows/class-table-metadata.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  class-table:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile active metadata and visualization
        run: python -m py_compile BertScript/class_table_metadata.py BertScript/class_table_ai_proposals.py BertScript/migrate_class_table.py BertScript/Test_result_Vis.py DatasetConverter/SMS/SMSMerger.py text_category_profiler/pipeline/DataConverter_utils.py tests/test_class_table_metadata.py tests/test_class_table_ai_proposals.py tests/test_class_table_csv_only.py tests/test_sms_merger_path_contract.py
      - name: Run dependency-light metadata tests
        run: python -m unittest -v tests.test_class_table_metadata tests.test_class_table_ai_proposals tests.test_class_table_csv_only
      - name: Validate ClassTable against TopicTree (warn-only graph differences)
        run: python -m BertScript.class_table_metadata validate
      - name: Verify full historical migration
        run: |
          git show ec212fd17835dd939b010a680955f95f12593598:BertScript/ClassTable.py > old-ClassTable.py
          python -m BertScript.migrate_class_table --source old-ClassTable.py --verify ClassesTree/data/ClassTable.csv
