name: BL-001 Tulip Manual Graph Experiment Boundary

on:
  pull_request:
    branches: [main]
    paths:
      - "text_category_profiler/tulip_utils/**"
      - "experiments/tulip_graph_builder.py"
      - "experiments/tulip_graph_builder.README.md"
      - "tests/test_tulip_manual_graph_boundary.py"
      - ".github/workflows/bl001-tulip-manual-graph.yml"
      - ".codex/**"
  push:
    branches: [main]
    paths:
      - "text_category_profiler/tulip_utils/**"
      - "experiments/tulip_graph_builder.py"
      - "experiments/tulip_graph_builder.README.md"
      - "tests/test_tulip_manual_graph_boundary.py"
      - ".github/workflows/bl001-tulip-manual-graph.yml"
      - ".codex/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tulip-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check syntax
        run: python -m py_compile text_category_profiler/tulip_utils/Graph_Builder.py experiments/tulip_graph_builder.py tests/test_tulip_manual_graph_boundary.py
      - name: Verify optional research boundary without Tulip
        run: python -m unittest -v tests.test_tulip_manual_graph_boundary tests.test_package_layout tests.test_project_docs tests.test_repository_compile_gate
      - name: Whitespace check
        run: git diff --check HEAD^ HEAD
