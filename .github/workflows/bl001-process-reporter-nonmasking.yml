name: BL-001 Root Child Failure Reporter Isolation

on:
  pull_request:
    branches: [main]
    paths:
      - "text_category_profiler/execution/process.py"
      - "tests/test_bl001_process_reporter_nonmasking.py"
      - ".github/workflows/bl001-process-reporter-nonmasking.yml"
  push:
    branches: [main]
    paths:
      - "text_category_profiler/execution/process.py"
      - "tests/test_bl001_process_reporter_nonmasking.py"
      - ".github/workflows/bl001-process-reporter-nonmasking.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  failstop-reporting:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ensure diagnostic logging cannot hide child exit failures
        run: python -m unittest -v tests.test_bl001_process_reporter_nonmasking tests.test_process_runner
