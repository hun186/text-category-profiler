name: Stage 4 Original Jaal Same-Port Compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - "BertScript/jaal_original_mount.py"
      - "BertScript/jaal_original_panel.py"
      - "BertScript/jaal_viewer_only.py"
      - "run-jaal-viewer-only.bat"
      - "BertScript/assets/15.jaal_embedded_autoheight.js"
      - "BertScript/assets/16.jaal_visible_labels.js"
      - "BertScript/assets/17.jaal_structural_collapse.js"
      - "BertScript/Test_result_Vis.py"
      - "ClassesTree/Visualization/jaal/jaalViewer.py"
      - "ClassesTree/Visualization/jaal/label_format.py"
      - "tests/test_jaal_original_mount.py"
      - "tests/test_jaal_label_format.py"
      - "tests/test_jaal_viewer_only.py"
      - "tests/jaal_autoheight.test.cjs"
      - "tests/jaal_visible_labels.test.cjs"
      - "tests/jaal_structural_collapse.test.cjs"
      - "requirements.txt"
      - ".github/workflows/stage4-original-jaal.yml"
  push:
    branches: [main]
    paths:
      - "BertScript/jaal_original_mount.py"
      - "BertScript/jaal_original_panel.py"
      - "BertScript/jaal_viewer_only.py"
      - "run-jaal-viewer-only.bat"
      - "BertScript/assets/15.jaal_embedded_autoheight.js"
      - "BertScript/Test_result_Vis.py"
      - "ClassesTree/Visualization/jaal/jaalViewer.py"
      - "ClassesTree/Visualization/jaal/label_format.py"
      - "tests/test_jaal_original_mount.py"
      - "tests/test_jaal_label_format.py"
      - "tests/test_jaal_viewer_only.py"
      - "tests/jaal_autoheight.test.cjs"
      - "requirements.txt"
      - ".github/workflows/stage4-original-jaal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-jaal-wsgi:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install real Jaal + Dash for WSGI compatibility check
        run: python -m pip install dash dash-bootstrap-components dash-cytoscape jaal pandas
      - name: Compile changed modules
        run: python -m py_compile BertScript/jaal_original_mount.py BertScript/jaal_original_panel.py BertScript/Test_result_Vis.py ClassesTree/Visualization/jaal/jaalViewer.py ClassesTree/Visualization/jaal/label_format.py tests/test_jaal_original_mount.py tests/test_jaal_label_format.py BertScript/jaal_viewer_only.py tests/test_jaal_viewer_only.py
      - name: Check original Jaal UI, lazy mount, callback and same-port assets
        run: python -m unittest -v tests.test_jaal_label_format tests.test_jaal_original_mount tests.test_jaal_viewer_only
      - name: Check Jaal direct-script path compatibility
        run: python -m unittest -v tests.test_jaal_viewer_path_contract
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Jaal iframe auto-height sizing and sidebar reflow
        run: |
          node --check BertScript/assets/15.jaal_embedded_autoheight.js
          node --check BertScript/assets/16.jaal_visible_labels.js
          node --check BertScript/assets/17.jaal_structural_collapse.js
          node --test tests/jaal_autoheight.test.cjs tests/jaal_visible_labels.test.cjs tests/jaal_structural_collapse.test.cjs
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
