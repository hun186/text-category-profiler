name: BL-001 Stage Writer Compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/bl001_stage_writer_check.py"
      - "run-bl001-stage-writer-check.bat"
      - "tests/test_bl001_stage_writer_check.py"
      - "tests/test_bl001_stage_tsv_shared.py"
      - "tests/test_bl001_stage_xlsx_shared.py"
      - "tests/test_bl001_stage_sql_shared.py"
      - "text_category_profiler/data/df_utils.py"
      - "tests/test_bl001_df_tsv_provider_contracts.py"
      - "text_category_profiler/data/stage_tsv.py"
      - "text_category_profiler/data/stage_xlsx.py"
      - "text_category_profiler/data/stage_sql.py"
      - "DatasetConverter/df_utils.py"
      - "BertScript/df_utils.py"
      - ".github/workflows/bl001-stage-writer-check.yml"
  push:
    branches: [main]
    paths:
      - "scripts/bl001_stage_writer_check.py"
      - "run-bl001-stage-writer-check.bat"
      - "tests/test_bl001_stage_writer_check.py"
      - "tests/test_bl001_stage_tsv_shared.py"
      - "tests/test_bl001_stage_xlsx_shared.py"
      - "tests/test_bl001_stage_sql_shared.py"
      - "text_category_profiler/data/df_utils.py"
      - "tests/test_bl001_df_tsv_provider_contracts.py"
      - "text_category_profiler/data/stage_tsv.py"
      - "text_category_profiler/data/stage_xlsx.py"
      - "text_category_profiler/data/stage_sql.py"
      - "DatasetConverter/df_utils.py"
      - "BertScript/df_utils.py"
      - ".github/workflows/bl001-stage-writer-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-stage-writers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pandas-version: ["2.2.3", "3.1.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated real export dependencies
        run: python -m pip install "pandas==${{ matrix.pandas-version }}" "xlsxwriter==3.2.9"
      - name: Run fail-closed real TSV XLSX SQLite fixtures
        run: python -m scripts.bl001_stage_writer_check
      - name: Verify preflight exit codes and skip protection
        run: python -m unittest -v tests.test_bl001_stage_writer_check
      - name: Verify canonical TSV real pandas bytes and adapter contracts
        run: python -m unittest -v tests.test_bl001_df_tsv_provider_contracts
