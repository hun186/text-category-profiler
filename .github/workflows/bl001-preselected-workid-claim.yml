name: BL-001 Explicit WorkID Acquisition Guard

on:
  pull_request:
    branches: [main]
    paths:
      - "text_category_profiler/pipeline/workpool.py"
      - "tests/test_bl001_preselected_workid_claim.py"
      - ".github/workflows/bl001-preselected-workid-claim.yml"
  push:
    branches: [main]
    paths:
      - "text_category_profiler/pipeline/workpool.py"
      - "tests/test_bl001_preselected_workid_claim.py"
      - ".github/workflows/bl001-preselected-workid-claim.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-claim:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify explicit and legacy automatic acquisition
        run: python -m unittest -v tests.test_bl001_preselected_workid_claim tests.test_workpool_manager tests.test_bl001_external_workid_path_validation
