name: BL-001 Delivery Completion Fail Closed

on:
  pull_request:
    branches: [main]
    paths:
      - "text_category_profiler/pipeline/workpool.py"
      - "tests/test_workpool_manager.py"
      - "tests/test_bl001_delivery_completion_fail_closed.py"
      - ".github/workflows/bl001-delivery-completion-fail-closed.yml"
  push:
    branches: [main]
    paths:
      - "text_category_profiler/pipeline/workpool.py"
      - "tests/test_workpool_manager.py"
      - "tests/test_bl001_delivery_completion_fail_closed.py"
      - ".github/workflows/bl001-delivery-completion-fail-closed.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delivery-completion:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify completion failures propagate and existing workpool contracts
        run: python -m unittest -v tests.test_bl001_delivery_completion_fail_closed tests.test_workpool_manager tests.test_bl001_external_workitem_move_no_overwrite
