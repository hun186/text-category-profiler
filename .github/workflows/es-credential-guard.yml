name: Elasticsearch Credential Guard
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - codex/remove-hardcoded-es-credentials
  workflow_dispatch:

permissions:
  contents: read

jobs:
  es-secret-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile ES credential guard
        run: python -m py_compile tests/test_es_secret_config.py
      - name: Run ES credential guard unit tests
        run: python -m unittest -v tests.test_es_secret_config
