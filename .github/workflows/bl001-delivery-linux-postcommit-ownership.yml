name: BL-001 Delivery Linux Ownership Commit Boundary

on:
  pull_request:
    branches: [main]
    paths:
      - "text_category_profiler/pipeline/workpool.py"
      - "tests/test_bl001_delivery_linux_postcommit_ownership.py"
      - ".github/workflows/bl001-delivery-linux-postcommit-ownership.yml"
  push:
    branches: [main]
    paths:
      - "text_category_profiler/pipeline/workpool.py"
      - "tests/test_bl001_delivery_linux_postcommit_ownership.py"
      - ".github/workflows/bl001-delivery-linux-postcommit-ownership.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delivery-ownership:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify committed-move ordering and fail-stop contracts
        run: python -m unittest -v tests.test_bl001_delivery_linux_postcommit_ownership tests.test_bl001_delivery_completion_fail_closed tests.test_workpool_manager
