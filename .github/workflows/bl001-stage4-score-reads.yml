name: BL-001 Stage 4 Score Range Read Boundary

on:
  pull_request:
    branches: [main]
    paths:
      - "BertScript/Test_result_Vis.py"
      - "BertScript/visualization_score_reads.py"
      - "tests/test_bl001_stage4_score_reads.py"
      - ".github/workflows/bl001-stage4-score-reads.yml"
  push:
    branches: [main]
    paths:
      - "BertScript/Test_result_Vis.py"
      - "BertScript/visualization_score_reads.py"
      - "tests/test_bl001_stage4_score_reads.py"
      - ".github/workflows/bl001-stage4-score-reads.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  score-reads:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pandas
      - run: python -m unittest discover -s tests -p "test_bl001_stage4_score_reads.py" -v
