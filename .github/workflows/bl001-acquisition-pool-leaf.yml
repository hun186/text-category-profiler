name: BL-001 Acquisition Pool Leaf Before Claim

on:
  pull_request:
    branches: [main]
    paths:
      - "text_category_profiler/filesystem/legacy.py"
      - "text_category_profiler/pipeline/workpool.py"
      - "tests/test_workpool_manager.py"
      - "tests/test_bl001_acquisition_pool_leaf.py"
      - ".github/workflows/bl001-acquisition-pool-leaf.yml"
  push:
    branches: [main]
    paths:
      - "text_category_profiler/filesystem/legacy.py"
      - "text_category_profiler/pipeline/workpool.py"
      - "tests/test_workpool_manager.py"
      - "tests/test_bl001_acquisition_pool_leaf.py"
      - ".github/workflows/bl001-acquisition-pool-leaf.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquisition-pool-leaf:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify invalid selected pool leaf fails before claim
        run: python -m unittest -v tests.test_bl001_acquisition_pool_leaf tests.test_tcf_workpool_characterization tests.test_workpool_manager tests.test_bl001_delivery_completion_fail_closed tests.test_bl001_external_workitem_move_no_overwrite
