name: Stage 4 Jaal Candidate Compatibility

# Test the exact reviewed upstream merged commit used as production pin.
# Exercise default five-mode runtime and forced four-mode fallback separately.
on:
  pull_request:
    paths:
      - ".github/workflows/jaal-candidate-compat.yml"
      - "tests/test_jaal_candidate_compat.py"
      - "tests/stage4_jaal_browser.py"
      - "tests/stage4_jaal_community_browser.py"
      - "BertScript/jaal_original_mount.py"
      - "requirements.txt"
      - "tools/stage4_candidate_desktop_acceptance.py"
      - "tests/test_stage4_candidate_desktop_acceptance.py"
      - "run-stage4-jaal-candidate-acceptance.bat"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-stage4:
    name: candidate-stage4-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install reviewed released Jaal at the exact production SHA
        run: >
          python -m pip install dash dash-bootstrap-components
          dash-cytoscape jaal pandas
          "jaal-topology-viewer @ git+https://github.com/hun186/jaal-topology-viewer.git@47942ac3bd08d8cbcc615fa215c5e5eef286f486"
      - name: Verify release provenance, default fifth mode and fallback
        env:
          JAAL_CANDIDATE_COMPAT: "1"
        run: python -m unittest -v tests.test_jaal_candidate_compat
      - name: Fail-closed Windows desktop acceptance port guard
        run: python -m unittest -v tests.test_stage4_candidate_desktop_acceptance
      - name: Real Jaal Stage 4 mount, controls, callbacks and path smoke
        # Windows GitHub runner's default English cp1252 cannot encode the
        # existing Chinese CLI --help text; this tests a declared UTF-8 runtime,
        # not default-codepage Windows CLI acceptance.
        env:
          PYTHONUTF8: "1"
          JAAL_STAGE4_COMMUNITY_CANDIDATE: "0"
        run: >
          python -m unittest -v
          tests.test_jaal_label_format
          tests.test_jaal_original_mount
          tests.test_jaal_viewer_only
          tests.test_jaal_runtime_diagnostics
          tests.test_jaal_viewer_path_contract
      - name: Retained Jaal browser JS contract in original four-mode consumer
        run: >
          node --test
          tests/jaal_visible_labels.test.cjs
          tests/jaal_structural_collapse.test.cjs
          tests/jaal_autoheight.test.cjs
      # Original Stage 4 JaalViewMain imports app-level helpers transitively;
      # the candidate-only package install intentionally avoids full ML deps.
      - name: Install real Stage 4 graph-only runtime imports
        if: matrix.os == 'windows-latest'
        run: >
          python -m pip install
          psutil GPUtil numpy opencc-python-reimplemented scipy
          setproctitle version-parser colorama tqdm
          pymongo elasticsearch pytz
      - name: Verify real Stage 4 graph provider imports before browser launch
        if: matrix.os == 'windows-latest'
        env:
          PYTHONUTF8: "1"
        run: python -c "from ClassesTree.Visualization.jaal.jaalViewer import JaalViewMain; assert callable(JaalViewMain)"
      - name: Install Windows Playwright harness
        if: matrix.os == 'windows-latest'
        run: python -m pip install playwright
      - name: Install Chromium on Windows
        if: matrix.os == 'windows-latest'
        run: python -m playwright install chromium
      - name: Exercise real lazy Stage 4 Jaal browser in same-port iframe
        if: matrix.os == 'windows-latest'
        env:
          PYTHONUTF8: "1"
        run: python tests/stage4_jaal_browser.py --evidence stage4-browser-evidence
      - name: Exercise real default fifth-mode Louvain release in Chromium
        if: matrix.os == 'windows-latest'
        env:
          PYTHONUTF8: "1"
        run: >-
          python tests/stage4_jaal_community_browser.py
          --evidence stage4-community-browser-evidence
      - name: Upload Stage 4 fifth-mode evidence (also on failure)
        if: always() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: stage4-community-windows-chromium
          path: stage4-community-browser-evidence/
          if-no-files-found: warn
      - name: Upload Stage 4 browser evidence (and server log on failure)
        if: always() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: stage4-jaal-windows-chromium
          path: stage4-browser-evidence/
          if-no-files-found: warn
