name: Stage 4 Jaal Candidate Compatibility

# Test an unmerged, immutable upstream candidate without replacing the
# production pin in requirements.txt or copying any portable JS/Python.
on:
  pull_request:
    paths:
      - ".github/workflows/jaal-candidate-compat.yml"
      - "tests/test_jaal_candidate_compat.py"
      - "tests/stage4_jaal_browser.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-stage4:
    name: candidate-stage4-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated dependencies + exact upstream candidate
        run: >
          python -m pip install dash dash-bootstrap-components
          dash-cytoscape jaal pandas
          "jaal-topology-viewer @ git+https://github.com/hun186/jaal-topology-viewer.git@613effaca891f761b59f099c4f4cf38d495297cd"
      - name: Verify candidate SHA, upstream fifth mode, consumer four-mode boundary
        env:
          JAAL_CANDIDATE_COMPAT: "1"
        run: python -m unittest -v tests.test_jaal_candidate_compat
      - name: Real Jaal Stage 4 mount, controls, callbacks and path smoke
        # Windows GitHub runner's default English cp1252 cannot encode the
        # existing Chinese CLI --help text; this tests a declared UTF-8 runtime,
        # not default-codepage Windows CLI acceptance.
        env:
          PYTHONUTF8: "1"
        run: >
          python -m unittest -v
          tests.test_jaal_label_format
          tests.test_jaal_original_mount
          tests.test_jaal_viewer_only
          tests.test_jaal_runtime_diagnostics
          tests.test_jaal_viewer_path_contract
      - name: Retained Jaal browser JS contract in original four-mode consumer
        run: >
          node --test
          tests/jaal_visible_labels.test.cjs
          tests/jaal_structural_collapse.test.cjs
          tests/jaal_autoheight.test.cjs
      - name: Install Windows Playwright harness
        if: matrix.os == 'windows-latest'
        run: python -m pip install playwright
      - name: Install Chromium on Windows
        if: matrix.os == 'windows-latest'
        run: python -m playwright install chromium
      - name: Exercise real lazy Stage 4 Jaal browser in same-port iframe
        if: matrix.os == 'windows-latest'
        env:
          PYTHONUTF8: "1"
        run: python tests/stage4_jaal_browser.py --evidence stage4-browser-evidence
      - name: Upload Stage 4 browser evidence (and server log on failure)
        if: always() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: stage4-jaal-windows-chromium
          path: stage4-browser-evidence/
          if-no-files-found: warn
