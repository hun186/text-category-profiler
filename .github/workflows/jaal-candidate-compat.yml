name: Stage 4 Jaal Candidate Compatibility

# Test an unmerged, immutable upstream candidate without replacing the
# production pin in requirements.txt or copying any portable JS/Python.
on:
  pull_request:
    paths:
      - ".github/workflows/jaal-candidate-compat.yml"
      - "tests/test_jaal_candidate_compat.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-stage4:
    name: candidate-stage4-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated dependencies + exact upstream candidate
        run: >
          python -m pip install dash dash-bootstrap-components
          dash-cytoscape jaal pandas
          "jaal-topology-viewer @ git+https://github.com/hun186/jaal-topology-viewer.git@613effaca891f761b59f099c4f4cf38d495297cd"
      - name: Verify candidate SHA, upstream fifth mode, consumer four-mode boundary
        run: python -m unittest -v tests.test_jaal_candidate_compat
      - name: Real Jaal Stage 4 mount, controls, callbacks and path smoke
        run: >
          python -m unittest -v
          tests.test_jaal_label_format
          tests.test_jaal_original_mount
          tests.test_jaal_viewer_only
          tests.test_jaal_runtime_diagnostics
          tests.test_jaal_viewer_path_contract
      - name: Retained Jaal browser JS contract in original four-mode consumer
        run: >
          node --test
          tests/jaal_visible_labels.test.cjs
          tests/jaal_structural_collapse.test.cjs
          tests/jaal_autoheight.test.cjs
