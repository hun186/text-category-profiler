name: BL-001 Classifier Stage No Overwrite

on:
  pull_request:
    branches: [main]
    paths:
      - "BertScript/classifier_stage.py"
      - "BertScript/RunClassfier.py"
      - "tests/test_bl001_classifier_workspace_no_overwrite.py"
      - ".github/workflows/bl001-classifier-workspace-no-overwrite.yml"
  push:
    branches: [main]
    paths:
      - "BertScript/classifier_stage.py"
      - "BertScript/RunClassfier.py"
      - "tests/test_bl001_classifier_workspace_no_overwrite.py"
      - ".github/workflows/bl001-classifier-workspace-no-overwrite.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classifier-workspace-guard:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify private no-overwrite and existing classifier contracts
        run: python -m unittest -v tests.test_bl001_classifier_workspace_no_overwrite tests.test_classifier_stage
