name: BL-001 Stage4 Derived Filter Restore Boundary

on:
  pull_request:
    branches: [main]
    paths:
      - "BertScript/visualization_callback_state.py"
      - "BertScript/visualization_stage.py"
      - "BertScript/Test_result_Vis.py"
      - "tests/test_bl001_stage4_derived_filter_restore.py"
      - ".github/workflows/bl001-stage4-derived-filter-restore.yml"
  push:
    branches: [main]
    paths:
      - "BertScript/visualization_callback_state.py"
      - "BertScript/visualization_stage.py"
      - "BertScript/Test_result_Vis.py"
      - "tests/test_bl001_stage4_derived_filter_restore.py"
      - ".github/workflows/bl001-stage4-derived-filter-restore.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filter-recovery:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify remount recovery and no IO on idle callbacks
        run: python -m unittest -v tests.test_bl001_stage4_derived_filter_restore tests.test_bl001_stage4_callback_state_boundary tests.test_visualization_stage
