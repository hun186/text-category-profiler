name: Stage 4 Read-Only History Preview

on:
  pull_request:
    branches: [main]
    paths:
      - "BertScript/stage4_history_data.py"
      - "BertScript/stage4_history_preview.py"
      - "BertScript/Test_result_Vis.py"
      - "run-stage4-history-preview.bat"
      - "tests/test_stage4_history_preview.py"
      - ".github/workflows/stage4-history-preview.yml"
  push:
    branches: [main]
    paths:
      - "BertScript/stage4_history_data.py"
      - "BertScript/stage4_history_preview.py"
      - "BertScript/Test_result_Vis.py"
      - "run-stage4-history-preview.bat"
      - "tests/test_stage4_history_preview.py"
      - ".github/workflows/stage4-history-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Stdlib tests before installing Dash or model dependencies
        run: |
          python -m py_compile BertScript/stage4_history_data.py BertScript/stage4_history_preview.py BertScript/Test_result_Vis.py tests/test_stage4_history_preview.py
          python -m unittest -v tests.test_stage4_history_preview
      - name: Install minimal real Jaal and Dash for complete browser layout smoke
        run: |
          python -m pip install dash dash-cytoscape dash-bootstrap-components jaal pandas "visdcc==0.0.63" "jaal-topology-viewer @ git+https://github.com/hun186/jaal-topology-viewer.git@7a7d8ba1f847b2f95a620c61a0c5a94f0523e255"
      - name: Verify actual page, SQL safety, Jaal WSGI and fast entrypoint
        run: |
          python -m unittest -v tests.test_stage4_history_preview
          python -m unittest -v tests.test_jaal_viewer_only tests.test_embedded_tree_panel
      - name: Verify compatibility with Windows dash-cytoscape 0.2.0
        run: |
          python -m pip install "dash-cytoscape==0.2.0"
          python -m unittest -v tests.test_stage4_history_preview
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
