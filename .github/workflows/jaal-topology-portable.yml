name: Portable Jaal Topology Package

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/jaal-topology/**"
      - "tests/test_jaal_topology_portable.py"
      - "tests/jaal_visible_labels.test.cjs"
      - "tests/jaal_structural_collapse.test.cjs"
      - ".github/workflows/jaal-topology-portable.yml"
  push:
    branches: [main]
    paths:
      - "packages/jaal-topology/**"
      - "tests/test_jaal_topology_portable.py"
      - ".github/workflows/jaal-topology-portable.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only portable Jaal package, not root ML requirements
        run: python -m pip install -e ./packages/jaal-topology
      - name: Run CSV, CLI, real Jaal WSGI integration
        run: python -m unittest -v tests.test_jaal_topology_portable
      - name: Run original Jaal interaction regression against portable browser engine
        run: node --test tests/jaal_visible_labels.test.cjs tests/jaal_structural_collapse.test.cjs
      - name: Verify Stage 4 has no duplicate browser engine sources
        run: |
          test ! -e BertScript/assets/16.jaal_visible_labels.js
          test ! -e BertScript/assets/17.jaal_structural_collapse.js
          test -s packages/jaal-topology/jaal_topology/assets/16.jaal_visible_labels.js
          test -s packages/jaal-topology/jaal_topology/assets/17.jaal_structural_collapse.js
      - name: Run real installed Jaal app with external working directory
        run: |
          cd /tmp
          python - <<'PY'
          from pathlib import Path
          from jaal_topology.data import load_graph, select_subgraph
          from jaal_topology.viewer import build_app
          source = Path('/tmp/portable-jaal-external-edges.csv')
          source.write_text('parent,child\nRoot,Child\n', encoding='utf-8')
          graph = select_subgraph(load_graph(source), 'Root')
          app = build_app(graph, root='Root')
          assert app.server.test_client().get('/_dash-layout').status_code == 200
          assert app.server.test_client().get('/assets/17.jaal_structural_collapse.js').status_code == 200
          PY
      - name: Confirm installed CLI is usable outside repository working directory
        run: |
          cd /tmp
          python -m jaal_topology --help
          jaal-topology --help
      - name: Confirm isolated package has no first-party Stage 4 imports
        run: |
          if grep -R -nE '^((from|import) (BertScript|ClassesTree|TCF_Params|text_category_profiler))' packages/jaal-topology/jaal_topology; then
            echo 'Portable package accidentally depends on the original repository'
            exit 1
          fi
      - name: Whitespace
        run: git diff --check HEAD^ HEAD
