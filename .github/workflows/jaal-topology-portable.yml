name: Portable Jaal Topology Package

on:
  pull_request:
    branches: [main]
    paths:
      - "BertScript/jaal_original_mount.py"
      - "requirements.txt"
      - "tests/test_jaal_external_source_contract.py"
      - "tests/test_jaal_topology_portable.py"
      - "tests/jaal_visible_labels.test.cjs"
      - "tests/jaal_structural_collapse.test.cjs"
      - ".github/workflows/jaal-topology-portable.yml"
  push:
    branches: [main]
    paths:
      - "BertScript/jaal_original_mount.py"
      - "requirements.txt"
      - "tests/test_jaal_topology_portable.py"
      - ".github/workflows/jaal-topology-portable.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned external Jaal package, not root ML requirements
        run: python -m pip install "jaal-topology-viewer @ git+https://github.com/hun186/jaal-topology-viewer.git@7a7d8ba1f847b2f95a620c61a0c5a94f0523e255"
      - name: Assert package imported from installed GitHub checkout, not vendored path
        run: |
          python - <<'PY'
          from pathlib import Path
          import jaal_topology
          assert not Path(jaal_topology.__file__).resolve().is_relative_to(
              Path.cwd().resolve() / "packages"
          )
          PY
      - name: Run CSV, CLI, real Jaal WSGI integration
        run: python -m unittest -v tests.test_jaal_topology_portable tests.test_jaal_external_source_contract
      # Standalone-package unit tests run in the independent repository CI.
      # This consumer repository runs its own cross-project integration below.
      - name: Run original Jaal interaction regression against portable browser engine
        run: node --test tests/jaal_visible_labels.test.cjs tests/jaal_structural_collapse.test.cjs
      - name: Verify Jaal code lives only in independent distribution
        run: |
          test ! -d packages/jaal-topology
          test ! -e BertScript/assets/16.jaal_visible_labels.js
          test ! -e BertScript/assets/17.jaal_structural_collapse.js
          python - <<'PY'
          from pathlib import Path
          from jaal_topology import ASSETS_DIR
          assert ASSETS_DIR.is_dir()
          for name in ("16.jaal_visible_labels.js",
                       "17.jaal_structural_collapse.js", "bootstrap.min.css"):
              assert (ASSETS_DIR / name).is_file()
          PY
      - name: Run real installed Jaal app with external working directory
        run: |
          cd /tmp
          python - <<'PY'
          from pathlib import Path
          from jaal_topology.data import load_graph, select_subgraph
          from jaal_topology.viewer import build_app
          source = Path('/tmp/portable-jaal-external-edges.csv')
          source.write_text('parent,child\nRoot,Child\n', encoding='utf-8')
          graph = select_subgraph(load_graph(source), 'Root')
          app = build_app(graph, root='Root')
          assert app.server.test_client().get('/_dash-layout').status_code == 200
          assert app.server.test_client().get('/assets/17.jaal_structural_collapse.js').status_code == 200
          PY
      - name: Confirm installed CLI is usable outside repository working directory
        run: |
          cd /tmp
          python -m jaal_topology --help
          jaal-topology --help
      - name: Confirm installed package has no first-party Stage 4 imports
        run: |
          python - <<'PY'
          from pathlib import Path
          import jaal_topology
          package = Path(jaal_topology.__file__).resolve().parent
          for f in package.glob("*.py"):
              source = f.read_text(encoding="utf-8")
              for line in source.splitlines():
                  if line.startswith((
                      "from BertScript", "import BertScript",
                      "from ClassesTree", "import ClassesTree",
                      "from TCF_Params", "import TCF_Params",
                      "from text_category_profiler", "import text_category_profiler",
                  )):
                      raise AssertionError(f"Stage 4 dependency {f}:{line}")
          PY
      - name: Whitespace
        run: git diff --check HEAD^ HEAD
