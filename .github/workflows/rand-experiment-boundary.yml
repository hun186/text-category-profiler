name: RAND Corpus Experiment Boundary
on:
  pull_request:
    branches: [main]
    paths:
      - "text_category_profiler/utilities_RAND.py"
      - "experiments/rand_corpus_labeling.py"
      - "tests/test_rand_experiment_boundary.py"
      - ".github/workflows/rand-experiment-boundary.yml"
  push:
    branches: [main]
    paths:
      - "text_category_profiler/utilities_RAND.py"
      - "experiments/rand_corpus_labeling.py"
      - "tests/test_rand_experiment_boundary.py"
      - ".github/workflows/rand-experiment-boundary.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rand-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile RAND entrypoint, experiment and tests
        run: python -m py_compile text_category_profiler/utilities_RAND.py experiments/rand_corpus_labeling.py tests/test_rand_experiment_boundary.py
      - name: Run dependency-light RAND characterization
        run: python -m unittest -v tests.test_rand_experiment_boundary
      - name: Verify existing package layout guard
        run: python -m unittest -v tests.test_package_layout
