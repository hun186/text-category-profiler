name: Historical CSV Fixture Boundary

on:
  pull_request:
    branches: [main]
    paths:
      - "text_category_profiler/KaggleExtraction/**"
      - "text_category_profiler/csvSample/**"
      - "experiments/fixtures/kaggle_csv_sample/**"
      - "tests/test_kaggle_csv_fixture_boundary.py"
      - ".github/workflows/kaggle-csv-fixture-boundary.yml"
      - ".codex/**"
  push:
    branches: [main]
    paths:
      - "text_category_profiler/KaggleExtraction/**"
      - "text_category_profiler/csvSample/**"
      - "experiments/fixtures/kaggle_csv_sample/**"
      - "tests/test_kaggle_csv_fixture_boundary.py"
      - ".github/workflows/kaggle-csv-fixture-boundary.yml"
      - ".codex/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  csv-fixture-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax-check fixture boundary regression
        run: python -m py_compile tests/test_kaggle_csv_fixture_boundary.py
      - name: Check all 26 source blobs and cross-file path references
        run: python -m unittest -v tests.test_kaggle_csv_fixture_boundary
      - name: Check architecture and documentation
        run: python -m unittest -v tests.test_package_layout tests.test_project_docs tests.test_repository_compile_gate
