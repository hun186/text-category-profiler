name: GPU Utility Dependency Contract

on:
  push:
    branches:
      - codex/declare-gputil-dependency-20261027
      - main
    paths:
      - "requirements.txt"
      - "tests/test_runtime_dependency_contract.py"
      - ".codex/**"
      - "AGENTS.md"
      - ".github/workflows/gputil-dependency-guard.yml"
  pull_request:
    branches: [main]
    paths:
      - "requirements.txt"
      - "tests/test_runtime_dependency_contract.py"
      - ".codex/**"
      - "AGENTS.md"
      - ".github/workflows/gputil-dependency-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gputil-dependency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and import declared GPU utility
        run: |
          python -m pip install GPUtil
          python -c "import GPUtil; print('GPUtil import OK:', GPUtil.__file__)"
      - name: Compile and test dependency/documentation contracts
        run: |
          python -m py_compile tests/test_runtime_dependency_contract.py tests/test_project_docs.py
          python -m unittest -v tests.test_runtime_dependency_contract tests.test_project_docs
