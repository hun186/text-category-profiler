name: BL-001 WorkPool Readonly Metadata

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/bl001_workpool_readonly_inventory.py"
      - "tests/test_bl001_workpool_readonly_inventory.py"
      - ".github/workflows/bl001-workpool-readonly-inventory.yml"
  push:
    branches: [main]
    paths:
      - "scripts/bl001_workpool_readonly_inventory.py"
      - "tests/test_bl001_workpool_readonly_inventory.py"
      - ".github/workflows/bl001-workpool-readonly-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workpool-metadata-safety:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Exercise bounded metadata-only filesystem inventory (fixture only)
        run: python -m unittest -v tests.test_bl001_workpool_readonly_inventory
