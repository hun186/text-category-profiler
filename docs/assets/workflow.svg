<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="360" viewBox="0 0 1160 360" role="img" aria-labelledby="title desc">
  <title id="title">text-category-profiler workflow</title>
  <desc id="desc">Workflow from text inputs through dataset conversion, topic tree labels, BERT or XLM classification, result merge, and Dash or Plotly analysis outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef6ff"/><stop offset="1" stop-color="#f7fbf2"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f5f8ff"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#46637f"/></marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#24435c" flood-opacity="0.16"/></filter>
    <style>
      .label{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,'Noto Sans TC',sans-serif;fill:#17324d}.title{font-size:28px;font-weight:750}.subtitle{font-size:15px;fill:#4f6680}.step{font-size:19px;font-weight:700}.small{font-size:13px;fill:#52677c}.chip{font-size:12px;font-weight:700;fill:#0f4f7c}.mono{font-family:'SFMono-Regular',Consolas,monospace;font-size:12px;fill:#31485e}.card{fill:url(#card);stroke:#c7d8ea;stroke-width:1.4;rx:18;filter:url(#shadow)}.accent{stroke:#33a6a6;stroke-width:4;stroke-linecap:round}.arrow{stroke:#46637f;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1160" height="360" rx="28" fill="url(#bg)"/>
  <text x="40" y="54" class="label title">文字分類工作流程</text>
  <text x="40" y="80" class="label subtitle">由 TCFMain.py 串接資料轉換、分類器執行、結果合併與視覺化分析</text>

  <g transform="translate(38 122)">
    <rect class="card" width="170" height="150"/><path class="accent" d="M24 34h58"/>
    <text x="24" y="62" class="label step">1. 輸入資料</text>
    <text x="24" y="92" class="label small">文字來源 / 工作池</text><text x="24" y="115" class="label small">固定測試資料</text><text x="24" y="138" class="label mono">WorkPool / raw text</text>
  </g>
  <path class="arrow" d="M220 197 H284"/>
  <g transform="translate(296 122)">
    <rect class="card" width="190" height="150"/><path class="accent" d="M24 34h58"/>
    <text x="24" y="62" class="label step">2. DatasetConverter</text>
    <text x="24" y="92" class="label small">清理、切分、轉檔</text><text x="24" y="115" class="label small">建立分類器資料集</text><text x="24" y="138" class="label mono">DataConverter.py</text>
  </g>
  <path class="arrow" d="M498 197 H562"/>
  <g transform="translate(574 122)">
    <rect class="card" width="190" height="150"/><path class="accent" d="M24 34h58"/>
    <text x="24" y="62" class="label step">3. 類別與模型</text>
    <text x="24" y="92" class="label small">TopicTree 標籤邊界</text><text x="24" y="115" class="label small">BERT / XLM 推論訓練</text><text x="24" y="138" class="label mono">RunClassfier.py</text>
  </g>
  <path class="arrow" d="M776 197 H840"/>
  <g transform="translate(852 122)">
    <rect class="card" width="190" height="150"/><path class="accent" d="M24 34h58"/>
    <text x="24" y="62" class="label step">4. 結果分析</text>
    <text x="24" y="92" class="label small">合併預測結果</text><text x="24" y="115" class="label small">Dash / Plotly 視覺化</text><text x="24" y="138" class="label mono">Combine + Vis</text>
  </g>
  <g transform="translate(76 305)"><rect width="1008" height="30" rx="15" fill="#dff3f0"/><text x="22" y="20" class="label chip">輸出：分類器資料集、SQLite 中間資料、預測結果、合併分析資料與視覺化報表</text></g>
</svg>
