<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">ChatGPT AI 代理人驅動的分類訓練集調優循環</title>
  <desc id="desc">從分類覆蓋盤點開始，由 AI 代理人連結當前世界資訊、設計分類結構與來源索引，再由正文爬取工具取得可用文本，經清整驗證與人工審核後進入模型訓練，並以評估結果啟動下一輪調優。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f0ff"/><stop offset="0.52" stop-color="#edf8ff"/><stop offset="1" stop-color="#eefbf3"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7357d9"/><stop offset="1" stop-color="#3b79d8"/>
    </linearGradient>
    <linearGradient id="data" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16a6a1"/><stop offset="1" stop-color="#48bd78"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#24334f" flood-opacity=".16"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5 0 10Z" fill="#59748a"/>
    </marker>
    <style>
      .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',Arial,sans-serif;fill:#192c43}.title{font-size:30px;font-weight:780}.sub{font-size:15px;fill:#536b7e}
      .tag{font-size:12px;font-weight:800;letter-spacing:1.4px;fill:#6146c6}.h{font-size:19px;font-weight:760}.p{font-size:13.5px;fill:#586e80}.mini{font-size:12px;fill:#6b7f8e}
      .num{font-size:15px;font-weight:850;fill:#fff}.card{fill:#fff;stroke:#cad9e5;stroke-width:1.25;filter:url(#shadow)}.line{fill:none;stroke:#59748a;stroke-width:2.2;marker-end:url(#arrow)}
      .chip{font-size:12px;font-weight:750;fill:#fff}.foot{font-size:13px;fill:#3c566b}.strong{font-weight:760;fill:#23465c}
    </style>
  </defs>

  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <circle cx="1110" cy="20" r="180" fill="#7357d9" opacity=".055"/><circle cx="70" cy="650" r="190" fill="#27b78b" opacity=".06"/>
  <text x="48" y="38" class="t tag">MODEL FOUNDATION · DATASET COVERAGE</text>
  <text x="48" y="78" class="t title">讓訓練集跟上世界：AI 代理人 × 正文爬取 × 品質閉環</text>
  <text x="48" y="106" class="t sub">模型基礎能力來自全面、及時且可稽核的訓練資料；不是一次性擴充，而是可重複的調優循環</text>

  <g transform="translate(48 150)">
    <rect class="card" width="204" height="278" rx="20"/>
    <circle cx="30" cy="32" r="17" fill="url(#agent)"/><text x="25" y="38" class="t num">1</text>
    <text x="55" y="39" class="t h">覆蓋缺口盤點</text>
    <text x="22" y="76" class="t p">完整讀取 TopicTree，檢查</text><text x="22" y="98" class="t p">既有節點、關係、同義詞</text><text x="22" y="120" class="t p">與分類粒度。</text>
    <g transform="translate(22 146)">
      <circle cx="14" cy="13" r="7" fill="#7357d9"/><path d="M22 13h70M48 13v32M48 45h52M100 45v28" stroke="#8ba1b2" stroke-width="2" fill="none"/>
      <circle cx="48" cy="45" r="7" fill="#3b79d8"/><circle cx="100" cy="45" r="7" fill="#3b79d8"/><circle cx="100" cy="73" r="7" fill="#fff" stroke="#e05f72" stroke-width="3"/>
      <text x="0" y="108" class="t mini">找出缺漏、過寬與重複類別</text>
    </g>
  </g>

  <path class="line" d="M262 289h34"/>

  <g transform="translate(306 150)">
    <rect class="card" width="204" height="278" rx="20"/>
    <circle cx="30" cy="32" r="17" fill="url(#agent)"/><text x="25" y="38" class="t num">2</text>
    <text x="55" y="39" class="t h">即時世界連結</text>
    <text x="22" y="76" class="t p">ChatGPT AI 代理人依提示</text><text x="22" y="98" class="t p">搜尋任務當日的公開資訊，</text><text x="22" y="120" class="t p">提出持續且可分類的議題。</text>
    <g transform="translate(52 146)">
      <circle cx="50" cy="48" r="43" fill="#edf2ff" stroke="#7357d9" stroke-width="2"/>
      <path d="M9 48h82M50 5c-20 18-20 68 0 86M50 5c20 18 20 68 0 86M17 26h66M17 70h66" stroke="#5578c6" stroke-width="1.7" fill="none"/>
      <circle cx="80" cy="19" r="8" fill="#e05f72"/>
    </g>
    <text x="22" y="258" class="t mini">最新性 × 重大性 × 資料可得性</text>
  </g>

  <path class="line" d="M520 289h34"/>

  <g transform="translate(564 150)">
    <rect class="card" width="204" height="278" rx="20"/>
    <circle cx="30" cy="32" r="17" fill="url(#agent)"/><text x="25" y="38" class="t num">3</text>
    <text x="55" y="39" class="t h">類別與來源設計</text>
    <text x="22" y="76" class="t p">產出 label、關係邊、子圖、</text><text x="22" y="98" class="t p">中英來源索引與配額規格，</text><text x="22" y="120" class="t p">維持 taxonomy 一致性。</text>
    <g transform="translate(22 148)">
      <rect width="160" height="27" rx="6" fill="#eeeaff"/><text x="10" y="18" class="t mini">新增邊.csv</text>
      <rect y="36" width="160" height="27" rx="6" fill="#e8f2ff"/><text x="10" y="54" class="t mini">分類子圖 + label 定義</text>
      <rect y="72" width="160" height="27" rx="6" fill="#e6f8f1"/><text x="10" y="90" class="t mini">來源索引 + quota</text>
    </g>
    <text x="22" y="258" class="t mini">先定義邊界，再蒐集文本</text>
  </g>

  <path class="line" d="M778 289h34"/>

  <g transform="translate(822 150)">
    <rect class="card" width="330" height="278" rx="20"/>
    <circle cx="30" cy="32" r="17" fill="url(#data)"/><text x="25" y="38" class="t num">4</text>
    <text x="55" y="39" class="t h">正文取得與資料化</text>
    <text x="22" y="76" class="t p">代理人先產出來源索引；自動爬蟲再抓取</text>
    <text x="22" y="98" class="t p">公開可存取的實際文章正文，清除頁面雜訊，</text>
    <text x="22" y="120" class="t p">保留 #T#[label]，逐篇即時存檔並記錄成敗。</text>
    <g transform="translate(22 140)">
      <rect width="286" height="78" rx="11" fill="#e7f8f1" stroke="#93d5b6"/>
      <path d="M22 22h38M22 38h55M22 54h45" stroke="#16a6a1" stroke-width="3" stroke-linecap="round"/>
      <path d="M94 39h45" stroke="#59748a" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="151" y="14" width="112" height="50" rx="7" fill="#fff" stroke="#48bd78"/>
      <text x="163" y="34" class="t mini">#T#[label]</text><text x="163" y="52" class="t mini">clean article.txt</text>
    </g>
    <rect x="22" y="230" width="286" height="28" rx="14" fill="url(#data)"/>
    <text x="46" y="249" class="t chip">遵守 robots.txt／不繞過登入、付費牆或 CAPTCHA</text>
  </g>

  <path class="line" d="M1036 442v34H764"/>

  <g transform="translate(564 486)">
    <rect class="card" width="588" height="126" rx="20"/>
    <circle cx="30" cy="32" r="17" fill="url(#data)"/><text x="25" y="38" class="t num">5</text>
    <text x="55" y="39" class="t h">品質閘門 → 訓練評估 → 回饋下一輪</text>
    <text x="22" y="73" class="t p">格式／標籤／配額／語言／重複檢查與人工抽查後，才納入 train/dev/test；</text>
    <text x="22" y="95" class="t p">以類別覆蓋、錯誤案例與模型表現重新定位缺口，回到步驟 1 持續調優。</text>
    <rect x="374" y="18" width="190" height="27" rx="13.5" fill="#e8f2ff"/><text x="394" y="36" class="t mini">human-in-the-loop · 可追溯</text>
  </g>

  <path class="line" d="M554 548H150v-108"/>
  <g transform="translate(48 630)">
    <text class="t foot"><tspan class="strong">核心分工：</tspan>AI 代理人負責「發現與設計」；爬蟲負責「取得實際正文」；驗證與人工審核負責「決定能否進入訓練集」。</text>
  </g>
</svg>
