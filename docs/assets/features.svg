<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="430" viewBox="0 0 1160 430" role="img" aria-labelledby="title desc">
  <title id="title">text-category-profiler feature highlights</title>
  <desc id="desc">Six feature cards describing script orchestration, dataset conversion, transformer classifiers, topic tree integration, analysis visualization, and lightweight validation boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff7e8"/><stop offset="1" stop-color="#eef6ff"/></linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="145%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#3a2b1c" flood-opacity="0.13"/></filter>
    <style>
      .text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,'Noto Sans TC',sans-serif;fill:#203044}.title{font-size:28px;font-weight:750}.subtitle{font-size:15px;fill:#667184}.card{fill:#fff;stroke:#ead8bd;stroke-width:1.4;rx:18;filter:url(#shadow)}.icon{font-size:28px}.h{font-size:18px;font-weight:750}.p{font-size:13.5px;fill:#59677a}.tag{font-size:12px;font-weight:700;fill:#8a5a00}.pill{fill:#fff1ce;stroke:#f1d18f}
    </style>
  </defs>
  <rect width="1160" height="430" rx="28" fill="url(#bg)"/>
  <text x="40" y="54" class="text title">特色介紹</text>
  <text x="40" y="80" class="text subtitle">面向研究型文字分類工作區的資料準備、模型分類與結果分析能力</text>

  <g transform="translate(40 115)"><rect class="card" width="340" height="118"/><text x="24" y="42" class="icon">🧭</text><text x="70" y="42" class="text h">主流程編排</text><text x="24" y="72" class="text p">以 TCFMain.py 串接轉換、分類、合併與</text><text x="24" y="94" class="text p">視覺化階段，保留單獨 stage script 彈性。</text></g>
  <g transform="translate(410 115)"><rect class="card" width="340" height="118"/><text x="24" y="42" class="icon">🧱</text><text x="70" y="42" class="text h">資料集轉換</text><text x="24" y="72" class="text p">將文字來源整理成分類器資料集與 SQLite</text><text x="24" y="94" class="text p">中間資料，支援批次工作池流程。</text></g>
  <g transform="translate(780 115)"><rect class="card" width="340" height="118"/><text x="24" y="42" class="icon">🤖</text><text x="70" y="42" class="text h">Transformer 分類</text><text x="24" y="72" class="text p">BERT / XLM / PyTorch transformer 相關腳本</text><text x="24" y="94" class="text p">可用於訓練、推論與模型實驗。</text></g>

  <g transform="translate(40 263)"><rect class="card" width="340" height="118"/><text x="24" y="42" class="icon">🌳</text><text x="70" y="42" class="text h">TopicTree 類別邊界</text><text x="24" y="72" class="text p">ClassesTree 工具集中管理 taxonomy、標籤</text><text x="24" y="94" class="text p">與分類層級資料。</text></g>
  <g transform="translate(410 263)"><rect class="card" width="340" height="118"/><text x="24" y="42" class="icon">📊</text><text x="70" y="42" class="text h">結果合併與視覺化</text><text x="24" y="72" class="text p">CombineTestResult 與 Dash/Plotly 腳本協助</text><text x="24" y="94" class="text p">檢視預測結果與分析輸出。</text></g>
  <g transform="translate(780 263)"><rect class="card" width="340" height="118"/><text x="24" y="42" class="icon">🧪</text><text x="70" y="42" class="text h">輕量驗證邊界</text><text x="24" y="72" class="text p">tests/ 聚焦無模型、無資料副作用的檢查，</text><text x="24" y="94" class="text p">完整流程需本機 fixture、模型與工作池。</text></g>

  <g transform="translate(40 390)"><rect class="pill" width="360" height="24" rx="12"/><text x="18" y="17" class="text tag">適合：資料轉換、分類實驗、預測結果檢視與流程文件化</text></g>
</svg>
