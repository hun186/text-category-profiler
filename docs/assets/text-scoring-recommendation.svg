<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">文本切片、分類算分與推薦方法論</title>
  <desc id="desc">將長文本切成保留上下文的片段，逐片分類並依類別權重算分，彙總文件分數，最後以門檻、排序與證據片段產生可解釋推薦。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2f"/>
      <stop offset="0.55" stop-color="#102d4a"/>
      <stop offset="1" stop-color="#123b43"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#163955"/>
      <stop offset="1" stop-color="#123147"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#59d5e0"/>
      <stop offset="1" stop-color="#8ee6a8"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020b13" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5 0 10Z" fill="#59d5e0"/>
    </marker>
    <style>
      .text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',Arial,sans-serif;fill:#f4fbff}
      .title{font-size:31px;font-weight:750;letter-spacing:.4px}.subtitle{font-size:15px;fill:#b9cfdd}
      .eyebrow{font-size:12px;font-weight:750;fill:#72dce0;letter-spacing:1.6px}.number{font-size:16px;font-weight:800;fill:#082238}
      .heading{font-size:20px;font-weight:750}.body{font-size:13.5px;fill:#bdd0dc}.mono{font-family:'SFMono-Regular',Consolas,monospace;font-size:12px;fill:#8ee6c3}
      .card{fill:url(#card);stroke:#31566e;stroke-width:1.2;filter:url(#shadow)}.arrow{fill:none;stroke:#59d5e0;stroke-width:2.4;marker-end:url(#arrow)}
      .note{font-size:13px;fill:#d7e7ee}.label{font-size:12px;font-weight:700;fill:#09263a}.formula{font-size:13px;font-weight:650;fill:#e9f7fb}
    </style>
  </defs>

  <rect width="1200" height="620" rx="28" fill="url(#background)"/>
  <circle cx="1080" cy="62" r="150" fill="#42c9c9" opacity=".06"/>
  <circle cx="1120" cy="560" r="210" fill="#80dfa3" opacity=".045"/>

  <text x="48" y="38" class="text eyebrow">CORE APPLICATION · EXPLAINABLE PIPELINE</text>
  <text x="48" y="78" class="text title">從長文本到可解釋推薦</text>
  <text x="48" y="105" class="text subtitle">切片保留語意脈絡，逐片分類量化訊號，再以文件級彙總與規則產生推薦</text>

  <g transform="translate(48 148)">
    <rect class="card" width="244" height="292" rx="20"/>
    <circle cx="32" cy="34" r="17" fill="url(#accent)"/><text x="27" y="40" class="text number">1</text>
    <text x="58" y="41" class="text heading">文本切片</text>
    <text x="24" y="75" class="text body">將長文依 token／字元長度切分，</text>
    <text x="24" y="97" class="text body">可搭配 stride 重疊以保留跨界上下文。</text>
    <g transform="translate(24 126)">
      <rect width="174" height="32" rx="7" fill="#e9f6fb"/><rect x="0" y="40" width="196" height="32" rx="7" fill="#c9edf0"/><rect x="0" y="80" width="150" height="32" rx="7" fill="#a9e5d3"/>
      <path d="M145 0v112" stroke="#59d5e0" stroke-width="1.5" stroke-dasharray="4 4" opacity=".8"/>
      <text x="12" y="21" class="label">chunk 01 · 前段語境</text><text x="12" y="61" class="label">chunk 02 · 重疊語境</text><text x="12" y="101" class="label">chunk 03 · 後段語境</text>
    </g>
    <text x="24" y="269" class="text mono">width + stride → chunks</text>
  </g>

  <path class="arrow" d="M304 294h42"/>

  <g transform="translate(358 148)">
    <rect class="card" width="244" height="292" rx="20"/>
    <circle cx="32" cy="34" r="17" fill="url(#accent)"/><text x="27" y="40" class="text number">2</text>
    <text x="58" y="41" class="text heading">逐片分類與算分</text>
    <text x="24" y="75" class="text body">模型為每個切片預測類別；再查表套用</text>
    <text x="24" y="97" class="text body">類別資訊權重，保留正負訊號與證據。</text>
    <g transform="translate(24 126)">
      <rect width="196" height="38" rx="8" fill="#0d263a" stroke="#386079"/><text x="12" y="24" class="text body">政策訊號</text><text x="152" y="24" class="text mono">+120</text>
      <rect y="48" width="196" height="38" rx="8" fill="#0d263a" stroke="#386079"/><text x="12" y="72" class="text body">背景描述</text><text x="160" y="72" class="text mono">+10</text>
      <rect y="96" width="196" height="38" rx="8" fill="#0d263a" stroke="#386079"/><text x="12" y="120" class="text body">排除訊號</text><text x="160" y="120" class="text mono">−50</text>
    </g>
    <text x="24" y="269" class="text mono">label → InfoScore[label]</text>
  </g>

  <path class="arrow" d="M614 294h42"/>

  <g transform="translate(668 148)">
    <rect class="card" width="244" height="292" rx="20"/>
    <circle cx="32" cy="34" r="17" fill="url(#accent)"/><text x="27" y="40" class="text number">3</text>
    <text x="58" y="41" class="text heading">文件級彙總</text>
    <text x="24" y="75" class="text body">聚合全部切片的分數與分布，避免只靠</text>
    <text x="24" y="97" class="text body">單一片段判斷整篇文件。</text>
    <g transform="translate(24 126)">
      <rect width="196" height="118" rx="12" fill="#0d263a" stroke="#386079"/>
      <path d="M24 90L65 68 104 77 142 35 174 20" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="24" cy="90" r="4" fill="#59d5e0"/><circle cx="65" cy="68" r="4" fill="#64d9d3"/><circle cx="104" cy="77" r="4" fill="#70ddc5"/><circle cx="142" cy="35" r="4" fill="#80e2b5"/><circle cx="174" cy="20" r="4" fill="#8ee6a8"/>
    </g>
    <text x="24" y="269" class="text mono">sum · mean · std · top class</text>
  </g>

  <path class="arrow" d="M924 294h42"/>

  <g transform="translate(978 148)">
    <rect class="card" width="174" height="292" rx="20"/>
    <circle cx="32" cy="34" r="17" fill="url(#accent)"/><text x="27" y="40" class="text number">4</text>
    <text x="58" y="41" class="text heading">推薦</text>
    <text x="20" y="75" class="text body">門檻篩選與排序，</text><text x="20" y="97" class="text body">輸出推薦與理由。</text>
    <circle cx="87" cy="164" r="52" fill="#0d263a" stroke="#4ebfae" stroke-width="2"/>
    <path d="M62 164l17 17 34-39" fill="none" stroke="#8ee6a8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="20" y="229" width="134" height="31" rx="15.5" fill="url(#accent)"/><text x="51" y="250" class="label">推薦 + 證據</text>
    <text x="20" y="281" class="text mono">threshold + rank</text>
  </g>

  <g transform="translate(48 474)">
    <rect width="1104" height="104" rx="18" fill="#0a2237" stroke="#31566e"/>
    <text x="24" y="31" class="text eyebrow">METHODOLOGY</text>
    <text x="24" y="60" class="text formula">文件分數 ＝ Σ 切片類別權重　｜　推薦判斷 ＝ 分數門檻 ＋ 排序策略 ＋ 業務規則</text>
    <text x="24" y="84" class="text note">方法重點：可調切片尺度、可追溯類別權重、同時觀察總分／平均／離散程度，並回傳高分切片作為推薦依據。</text>
  </g>
</svg>
