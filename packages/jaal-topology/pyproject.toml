[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jaal-topology-viewer"
version = "0.1.0"
description = "Read-only directed CSV graph viewer powered by Jaal"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["jaal>=0.1.9", "pandas>=1.5"]

[project.scripts]
jaal-topology = "jaal_topology.cli:main"

[tool.setuptools]
packages = ["jaal_topology"]

[tool.setuptools.package-data]
jaal_topology = ["assets/*.js", "assets/*.css"]
